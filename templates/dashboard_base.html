{% extends 'base.html' %}

{% block content %}
<div class="min-h-dvh bg-neutral-200 md:py-6">
    <div class="relative mx-auto flex h-dvh w-full max-w-xl flex-col overflow-hidden bg-background md:h-[calc(100dvh-3rem)] md:rounded-2xl md:border md:border-border md:shadow-xl">
        <header class="z-30 flex items-center justify-between border-b border-border bg-card px-4 py-3">
            <a href="{{ url_for('dashboard.index') }}" class="flex items-center gap-2" aria-label="ShramLink home">
                <span class="flex size-8 items-center justify-center rounded-lg bg-primary text-primary-foreground">
                    <i data-lucide="hard-hat" class="size-5"></i>
                </span>
                <span class="text-lg font-extrabold tracking-tight text-foreground">Shram<span class="text-primary">Link</span></span>
            </a>
            <div class="flex items-center gap-3">
                <div class="text-right leading-tight">
                    <p class="max-w-40 truncate text-sm font-bold text-foreground">{{ user_name }}</p>
                    <p class="text-xs text-muted-foreground">{{ role_label }}</p>
                </div>
                <form method="POST" action="{{ url_for('auth.logout') }}">
                    <button type="submit" class="flex size-10 items-center justify-center rounded-lg border border-border text-muted-foreground hover:bg-muted hover:text-foreground" aria-label="Log out">
                        <i data-lucide="log-out" class="size-5"></i>
                    </button>
                </form>
            </div>
        </header>
        <div class="flex min-h-0 flex-1 flex-col">
            {% block dashboard_content %}{% endblock %}
        </div>
    </div>
</div>
{% endblock %}
